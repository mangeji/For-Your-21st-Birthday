<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18251d">
    <title>Make a Wish, Vasco!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            font-family: "DM Sans", sans-serif;
            background: #18251d;
            color: #fff8e9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 28px 18px;
            place-items: center;
            background:
                radial-gradient(ellipse at 50% 25%, rgba(91, 111, 67, .38), transparent 54%),
                #18251d;
        }

        button {
            font: inherit;
        }

        .birthday-scene {
            width: min(100%, 760px);
            padding: clamp(24px, 6vw, 56px);
            border: 1px solid rgba(231, 208, 158, .18);
            border-radius: 28px;
            background: rgba(255, 248, 233, .045);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .24);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #dec795;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .28em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #f7e3b6;
            font-family: "Great Vibes", cursive;
            font-size: clamp(3.4rem, 10vw, 6rem);
            font-weight: 400;
            line-height: 1.05;
        }

        .instructions {
            max-width: 480px;
            margin: 14px auto 0;
            color: rgba(255, 248, 233, .76);
            line-height: 1.7;
        }

        .cake {
            position: relative;
            display: grid;
            min-height: 340px;
            margin: 28px auto 20px;
            place-items: end center;
        }

        .candles {
            position: absolute;
            z-index: 1;
            bottom: 116px;
            display: flex;
            align-items: flex-end;
            gap: clamp(22px, 8vw, 58px);
        }

        .number-candle {
            position: relative;
            display: grid;
            width: clamp(68px, 18vw, 112px);
            height: clamp(132px, 34vw, 180px);
            place-items: center;
            color: #fff0ce;
            font-family: "Playfair Display", serif;
            font-size: clamp(118px, 31vw, 164px);
            font-weight: 600;
            line-height: 1;
            text-shadow: 3px 4px 0 #b87d55, 0 0 28px rgba(255, 201, 111, .14);
            filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .24));
        }

        .number-candle::before {
            position: absolute;
            top: 4px;
            left: 50%;
            width: 3px;
            height: 18px;
            border-radius: 3px;
            background: #493328;
            content: "";
            transform: translateX(-50%);
        }

        .flame {
            position: absolute;
            top: -48px;
            left: 50%;
            width: 24px;
            height: 43px;
            border-radius: 55% 45% 52% 48% / 65% 65% 35% 35%;
            background: radial-gradient(ellipse at 50% 70%, #fff9bf 0 11%, #ffc44e 40%, #fa742c 75%, rgba(239, 78, 35, .35) 100%);
            box-shadow: 0 0 18px 7px rgba(255, 162, 54, .42), 0 0 55px 18px rgba(255, 145, 43, .2);
            transform: translateX(-50%);
            transform-origin: 50% 100%;
            animation: flicker 1.8s ease-in-out infinite alternate;
            transition: opacity .35s ease, transform .45s ease;
        }

        .cake.is-out .flame {
            opacity: 0;
            transform: translate(-50%, 18px) scale(.25);
        }

        .cake-base {
            position: relative;
            width: min(100%, 410px);
            height: 120px;
            border: 1px solid rgba(255, 237, 207, .4);
            border-radius: 50% / 24%;
            background:
                radial-gradient(ellipse at 50% 5%, #fff0ce 0 5%, transparent 6%),
                linear-gradient(90deg, #a8754e, #f2d5a4 18%, #fff0ce 48%, #e9c18a 82%, #9c6948);
            box-shadow: inset 0 -12px 18px rgba(84, 45, 24, .18), 0 20px 34px rgba(0, 0, 0, .26);
        }

        .cake-base::before {
            position: absolute;
            top: -12px;
            right: -1px;
            left: -1px;
            height: 35px;
            border: 1px solid rgba(255, 237, 207, .5);
            border-radius: 50%;
            background: linear-gradient(90deg, #c39162, #fff0ce 45%, #d4a576);
            content: "";
        }

        .cake-base::after {
            position: absolute;
            top: 20px;
            right: 12%;
            left: 12%;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(ellipse, #f7e3b6 0 4%, transparent 5%) 0 0 / 38px 12px repeat-x;
            content: "";
            opacity: .8;
        }

        .message {
            min-height: 1.7em;
            margin: 18px 0;
            color: #f7e3b6;
            font-family: "Playfair Display", serif;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .control {
            min-height: 46px;
            padding: 11px 19px;
            border: 1px solid rgba(231, 208, 158, .45);
            border-radius: 999px;
            background: rgba(255, 248, 233, .09);
            color: #f7e3b6;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease, transform .2s ease;
        }

        .control:hover,
        .control:focus-visible {
            border-color: rgba(231, 208, 158, .85);
            background: rgba(255, 248, 233, .16);
        }

        .control:active {
            transform: scale(.98);
        }

        .control:disabled {
            cursor: default;
            opacity: .65;
        }

        .back-link {
            display: inline-block;
            margin-top: 26px;
            color: rgba(255, 248, 233, .68);
            font-size: .9rem;
            text-decoration-color: rgba(255, 248, 233, .35);
            text-underline-offset: 4px;
        }

        .back-link:hover,
        .back-link:focus-visible {
            color: #f7e3b6;
        }

        @keyframes flicker {
            from { rotate: -3deg; scale: .97 1; }
            to { rotate: 3deg; scale: 1.02 .96; }
        }

        @media (max-width: 480px) {
            .cake {
                min-height: 290px;
            }

            .candles {
                bottom: 106px;
            }

            .cake-base {
                height: 100px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="birthday-scene">
        <p class="eyebrow">One last birthday wish</p>
        <h1>Happy 21st, Vasco!</h1>
        <p class="instructions">Make a wish, then blow toward your microphone to put out both candles.</p>

        <div class="cake" id="cake" role="img" aria-label="A birthday cake with lit number 2 and 1 candles">
            <div class="candles" aria-hidden="true">
                <span class="number-candle">2<span class="flame"></span></span>
                <span class="number-candle">1<span class="flame"></span></span>
            </div>
            <div class="cake-base"></div>
        </div>

        <p class="message" id="message" role="status" aria-live="polite">Ready when you are. Turn on the microphone to blow them out.</p>
        <div class="controls">
            <button class="control" id="mic-button" type="button">Enable microphone</button>
            <button class="control" id="blow-button" type="button">Put out the candles</button>
            <button class="control" id="relight-button" type="button" hidden>Light them again</button>
        </div>
        <a class="back-link" href="birthday-page-21.html">← Back to your birthday letter</a>
    </main>

    <script>
        const cake = document.getElementById("cake");
        const message = document.getElementById("message");
        const micButton = document.getElementById("mic-button");
        const blowButton = document.getElementById("blow-button");
        const relightButton = document.getElementById("relight-button");
        let microphoneStream;
        let audioContext;
        let animationFrame;

        function stopMicrophone() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = undefined;
            }
            if (microphoneStream) {
                microphoneStream.getTracks().forEach(track => track.stop());
                microphoneStream = undefined;
            }
            if (audioContext && audioContext.state !== "closed") {
                audioContext.close();
                audioContext = undefined;
            }
        }

        function extinguishCandles() {
            if (cake.classList.contains("is-out")) {
                return;
            }
            cake.classList.add("is-out");
            cake.setAttribute("aria-label", "A birthday cake with extinguished number 2 and 1 candles");
            message.textContent = "Wish made! May your 21st year be wonderful.";
            micButton.disabled = true;
            blowButton.hidden = true;
            relightButton.hidden = false;
            stopMicrophone();
        }

        async function listenForBlow() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                message.textContent = "Microphone access is not available here. You can still put out the candles with the button.";
                return;
            }

            micButton.disabled = true;
            message.textContent = "Allow microphone access, then blow toward your device.";

            try {
                microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) {
                    throw new Error("Audio input is not supported by this browser.");
                }

                audioContext = new AudioContextClass();
                await audioContext.resume();
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 1024;
                audioContext.createMediaStreamSource(microphoneStream).connect(analyser);
                const samples = new Uint8Array(analyser.fftSize);
                let noiseFloor = 0.012;
                let loudFrames = 0;
                message.textContent = "Listening... blow toward your microphone!";

                function detectBlow() {
                    if (cake.classList.contains("is-out")) {
                        return;
                    }

                    analyser.getByteTimeDomainData(samples);
                    let sum = 0;
                    for (const sample of samples) {
                        const value = (sample - 128) / 128;
                        sum += value * value;
                    }
                    const volume = Math.sqrt(sum / samples.length);
                    const threshold = Math.max(0.085, noiseFloor * 3.2);

                    if (volume > threshold) {
                        loudFrames += 1;
                        if (loudFrames >= 8) {
                            extinguishCandles();
                            return;
                        }
                    } else {
                        loudFrames = 0;
                        noiseFloor = noiseFloor * 0.94 + volume * 0.06;
                    }
                    animationFrame = requestAnimationFrame(detectBlow);
                }

                detectBlow();
            } catch (error) {
                stopMicrophone();
                micButton.disabled = false;
                message.textContent = error.name === "NotAllowedError"
                    ? "Microphone permission was denied. Allow it in your browser settings, or use the button to put out the candles."
                    : `Couldn't start the microphone: ${error.message} You can still use the button.`;
            }
        }

        function relightCandles() {
            cake.classList.remove("is-out");
            cake.setAttribute("aria-label", "A birthday cake with lit number 2 and 1 candles");
            message.textContent = "Ready when you are. Turn on the microphone to blow them out.";
            micButton.disabled = false;
            blowButton.hidden = false;
            relightButton.hidden = true;
        }

        micButton.addEventListener("click", listenForBlow);
        blowButton.addEventListener("click", extinguishCandles);
        relightButton.addEventListener("click", relightCandles);
        window.addEventListener("pagehide", stopMicrophone);
    </script>
</body>
</html>

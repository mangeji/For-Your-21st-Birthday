<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18251d">
    <title>Happiest Birthday, Vasco!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            font-family: "DM Sans", sans-serif;
            background: #18251d;
            color: #fff8e9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(91, 111, 67, .38), transparent 54%),
                #18251d;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .welcome {
            position: fixed;
            z-index: 2;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at center, rgba(65, 83, 52, .72), rgba(18, 29, 23, .97) 70%),
                #18251d;
            text-align: center;
            cursor: pointer;
            transition: opacity .8s ease, visibility .8s ease;
        }

        .welcome.is-hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .welcome-content {
            animation: welcome-glow 3s ease-in-out infinite alternate;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #dec795;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .28em;
            text-transform: uppercase;
        }

        .welcome h1 {
            margin: 0;
            color: #f7e3b6;
            font-family: "Great Vibes", cursive;
            font-size: clamp(3.7rem, 11vw, 7.5rem);
            font-weight: 400;
            line-height: 1.05;
        }

        .welcome-hint {
            margin: 28px 0 0;
            color: rgba(255, 248, 233, .76);
            font-size: .9rem;
            letter-spacing: .12em;
        }

        main {
            width: min(100% - 36px, 1000px);
            margin: 0 auto;
            padding: 36px 0 48px;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity .8s ease .2s, transform .8s ease .2s;
        }

        main.is-open {
            opacity: 1;
            transform: translateY(0);
        }

        .music-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 12px 24px;
            align-items: center;
            min-width: 0;
            padding: 20px 24px;
            border: 1px solid rgba(231, 208, 158, .2);
            border-radius: 18px;
            background: rgba(255, 248, 233, .06);
            box-shadow: 0 16px 50px rgba(0, 0, 0, .16);
        }

        .music-copy h2 {
            margin: 0 0 4px;
            color: #f7e3b6;
            font-family: "Playfair Display", serif;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .music-copy p {
            margin: 0;
            color: rgba(255, 248, 233, .65);
            font-size: .82rem;
        }

        .music-player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #101813;
        }

        .music-player-wrap {
            position: relative;
            width: 100%;
            min-width: 0;
            margin-top: 4px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
        }

        .birthday-layout {
            display: grid;
            grid-template-columns: minmax(220px, .8fr) minmax(0, 1.2fr);
            gap: clamp(28px, 6vw, 70px);
            align-items: center;
            margin-top: clamp(38px, 7vw, 72px);
        }

        .candle-scene {
            position: relative;
            display: grid;
            min-height: 370px;
            place-items: center;
            overflow: hidden;
            border: 1px solid rgba(231, 208, 158, .12);
            border-radius: 24px;
            background:
                radial-gradient(ellipse at 50% 63%, rgba(255, 174, 70, .14), transparent 34%),
                linear-gradient(155deg, rgba(255, 248, 233, .045), rgba(255, 248, 233, .01));
        }

        .candle-scene::before {
            position: absolute;
            right: 12%;
            bottom: 24px;
            left: 12%;
            height: 18px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .25);
            content: "";
            filter: blur(10px);
        }

        .candle {
            position: relative;
            width: 82px;
            height: 205px;
            margin-top: 66px;
            border-radius: 13px 13px 9px 9px;
            background:
                linear-gradient(90deg, #a8754e 0%, #f2d5a4 18%, #fff0ce 47%, #e9c18a 77%, #9c6948 100%);
            box-shadow:
                inset 8px 0 12px rgba(255, 255, 255, .35),
                inset -9px 0 13px rgba(84, 45, 24, .2),
                0 18px 25px rgba(0, 0, 0, .25),
                0 0 65px rgba(255, 167, 66, .15);
        }

        .candle::before {
            position: absolute;
            top: -5px;
            right: 0;
            left: 0;
            height: 14px;
            border-radius: 50%;
            background: linear-gradient(90deg, #c39162, #fff0ce 45%, #d4a576);
            content: "";
        }

        .candle::after {
            position: absolute;
            top: -18px;
            left: 50%;
            width: 3px;
            height: 21px;
            border-radius: 3px;
            background: #493328;
            content: "";
            transform: translateX(-50%);
        }

        .flame {
            position: absolute;
            z-index: 1;
            top: -68px;
            left: 50%;
            width: 27px;
            height: 54px;
            border-radius: 55% 45% 52% 48% / 65% 65% 35% 35%;
            background: radial-gradient(ellipse at 50% 70%, #fff9bf 0 11%, #ffc44e 40%, #fa742c 75%, rgba(239, 78, 35, .35) 100%);
            box-shadow: 0 0 20px 8px rgba(255, 162, 54, .42), 0 0 70px 22px rgba(255, 145, 43, .2);
            transform: translateX(-50%);
            transform-origin: 50% 100%;
            animation: flicker 1.8s ease-in-out infinite alternate;
        }

        .wax-drip {
            position: absolute;
            top: 2px;
            width: 13px;
            border-radius: 0 0 9px 9px;
            background: linear-gradient(90deg, #dfb57f, #fff0ce 65%, #e9c18a);
            box-shadow: 1px 3px 4px rgba(96, 56, 34, .12);
        }

        .wax-drip-one {
            left: 16px;
            height: 35px;
        }

        .wax-drip-two {
            right: 14px;
            height: 24px;
        }

        .candle-caption {
            position: absolute;
            right: 0;
            bottom: 24px;
            left: 0;
            margin: 0;
            color: rgba(255, 248, 233, .55);
            font-family: "Playfair Display", serif;
            font-size: .9rem;
            letter-spacing: .08em;
            text-align: center;
        }

        .message-panel {
            padding: 12px 0;
        }

        .message-panel .eyebrow {
            margin-bottom: 10px;
            color: #d6b97c;
        }

        .message-panel h2 {
            margin: 0 0 22px;
            color: #f7e3b6;
            font-family: "Great Vibes", cursive;
            font-size: clamp(2.8rem, 6vw, 4.6rem);
            font-weight: 400;
            line-height: 1;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 225px;
            resize: none;
            padding: 18px 19px;
            border: 1px solid rgba(231, 208, 158, .25);
            border-radius: 14px;
            outline: none;
            background: rgba(255, 248, 233, .055);
            color: #fff8e9;
            font-size: .98rem;
            line-height: 1.8;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        textarea::placeholder {
            color: rgba(255, 248, 233, .45);
        }

        textarea:focus {
            border-color: rgba(231, 208, 158, .7);
            box-shadow: 0 0 0 3px rgba(231, 208, 158, .1);
        }

        .message-hint {
            margin: 10px 0 0;
            color: rgba(255, 248, 233, .48);
            font-size: .76rem;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) rotate(-3deg) scale(.97, 1); }
            35% { transform: translateX(-50%) rotate(2deg) scale(1.02, .98); }
            70% { transform: translateX(-50%) rotate(-1deg) scale(.98, 1.03); }
            100% { transform: translateX(-50%) rotate(3deg) scale(1.01, .97); }
        }

        @keyframes welcome-glow {
            from { filter: drop-shadow(0 0 12px rgba(247, 227, 182, .08)); }
            to { filter: drop-shadow(0 0 30px rgba(247, 227, 182, .22)); }
        }

        @media (max-width: 650px) {
            main {
                width: min(100% - 28px, 480px);
                padding-top: 18px;
            }

            .music-card {
                grid-template-columns: 1fr;
                padding: 18px;
            }

            .music-actions {
                flex-wrap: wrap;
            }

            .birthday-layout {
                grid-template-columns: 1fr;
                gap: 24px;
                margin-top: 32px;
            }

            .candle-scene {
                min-height: 300px;
            }

            .candle {
                transform: scale(.86);
            }

            .message-panel {
                padding: 8px 4px 20px;
            }

            textarea {
                min-height: 190px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="is-open" id="birthday-card" aria-label="Birthday card">
        <section class="music-card" aria-label="Birthday music">
            <div class="music-copy">
                <h2>A song for your special day</h2>
            </div>
            <div class="music-player-wrap">
                <iframe
                    class="music-player"
                    src="https://www.youtube-nocookie.com/embed/mVRAGW3TggU?si=ldLJ6CELfThBsUTU"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            </div>
        </section>

        <section class="birthday-layout">
            <div class="candle-scene" role="img" aria-label="A lit, flickering birthday candle">
                <div class="candle">
                    <span class="flame"></span>
                    <span class="wax-drip wax-drip-one"></span>
                    <span class="wax-drip wax-drip-two"></span>
                </div>
                <p class="candle-caption">Make a wish</p>
            </div>

            <div class="message-panel">
                <p class="eyebrow">For my favorite person</p>
                <h2>A note for you</h2>
                <textarea aria-label="Birthday message"> Happy birthday, baba! You deserve the best on your special day and always; so my first wish for you is that you have a wonderful birthday and a year filled with happiness, love, and success. I hope this year brings you closer to your dreams and that you continue to grow and thrive in all aspects of your life. May your birthday be as amazing as you are, and may all your wishes come true!
                </textarea>
            </div>
        </section>
    </main>

</body>
</html>
